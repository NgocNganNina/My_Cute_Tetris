<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💎 Jewel Tetris 💎</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-galaxy">

  <!-- Animated background particles -->
  <canvas id="particles-canvas"></canvas>

  <!-- ── MOBILE TOP BAR (visible only on mobile) ── -->
  <div id="mobile-topbar" class="mobile-topbar">
    <div class="mobile-stat">
      <span class="mobile-label">NEXT</span>
      <canvas id="next-canvas-mobile" width="56" height="56"></canvas>
    </div>
    <div class="mobile-stat">
      <span class="mobile-label">SCORE</span>
      <span id="score-mobile" class="mobile-val">0</span>
    </div>
    <div class="mobile-stat">
      <span class="mobile-label">LVL</span>
      <span id="level-mobile" class="mobile-val">1</span>
    </div>
    <div class="mobile-stat">
      <span class="mobile-label">LINES</span>
      <span id="lines-mobile" class="mobile-val">0</span>
    </div>
  </div>

  <!-- ── MAIN GAME VIEWPORT ── -->
  <div class="game-viewport">
    <div class="wrapper">

      <!-- LEFT panel -->
      <aside class="side-panel left-panel">
        <div class="game-title">💎<br>JEWEL<br>TETRIS</div>
        <div class="panel-box">
          <h3>NEXT</h3>
          <canvas id="next-canvas" width="116" height="116"></canvas>
        </div>
        <div class="panel-box">
          <h3>SCORE</h3>
          <div id="score" class="stat-value">0</div>
        </div>
        <div class="panel-box">
          <h3>LEVEL</h3>
          <div id="level" class="stat-value">1</div>
        </div>
        <div class="panel-box">
          <h3>LINES</h3>
          <div id="lines" class="stat-value">0</div>
        </div>
      </aside>

      <!-- GAME CANVAS AREA -->
      <main class="game-area">
        <canvas id="game-canvas" width="300" height="600"></canvas>

        <!-- Mobile D-pad controls -->
        <div id="mobile-controls" class="mobile-controls">
          <div class="dpad-grid">
            <!-- Row 1 -->
            <div class="dpad-cell"></div>
            <button class="dpad-btn" id="mb-rotate"   aria-label="Rotate">⬆<br><small>ROTATE</small></button>
            <div class="dpad-cell"></div>
            <!-- Row 2 -->
            <button class="dpad-btn" id="mb-left"     aria-label="Left">◀</button>
            <button class="dpad-btn" id="mb-down"     aria-label="Soft Drop">⬇<br><small>SOFT</small></button>
            <button class="dpad-btn" id="mb-right"    aria-label="Right">▶</button>
            <!-- Row 3 -->
            <button class="dpad-btn drop-btn" id="mb-harddrop" aria-label="Hard Drop" style="grid-column:1/-1">
              ⬇⬇ HARD DROP
            </button>
          </div>
        </div>

        <!-- Game overlay (start / pause / gameover) -->
        <div id="overlay" class="overlay">
          <div class="overlay-box">
            <h1 id="overlay-title">💎 JEWEL TETRIS 💎</h1>
            <p id="overlay-msg">Choose a theme and press Start!</p>
            <button id="start-btn" class="btn primary-btn">▶ START GAME</button>
          </div>
        </div>
      </main>

      <!-- RIGHT panel -->
      <aside class="side-panel right-panel">
        <div class="panel-box theme-selector">
          <h3>THEME</h3>
          <button class="theme-btn active" data-theme="galaxy">🌌 Galaxy</button>
          <button class="theme-btn" data-theme="ocean">🌊 Ocean</button>
          <button class="theme-btn" data-theme="candy">🍬 Candy</button>
        </div>
        <div class="panel-box">
          <h3>CONTROLS</h3>
          <ul class="controls-list">
            <li><span class="key">◀▶</span> Move</li>
            <li><span class="key">▲</span> Rotate</li>
            <li><span class="key">▼</span> Soft Drop</li>
            <li><span class="key">SPC</span> Hard Drop</li>
            <li><span class="key">P</span> Pause</li>
          </ul>
        </div>
        <div class="panel-box">
          <h3>HIGH SCORE</h3>
          <div id="high-score" class="stat-value">0</div>
        </div>
        <button id="pause-btn"   class="btn">⏸ PAUSE</button>
        <button id="restart-btn" class="btn">🔄 RESTART</button>
      </aside>

    </div><!-- .wrapper -->
  </div><!-- .game-viewport -->

  <!-- Mobile theme + action buttons bar (bottom) -->
  <div id="mobile-bottombar" class="mobile-bottombar">
    <button class="theme-btn-mob active" data-theme="galaxy">🌌</button>
    <button class="theme-btn-mob" data-theme="ocean">🌊</button>
    <button class="theme-btn-mob" data-theme="candy">🍬</button>
    <button id="mob-pause-btn"   class="mob-action-btn">⏸</button>
    <button id="mob-restart-btn" class="mob-action-btn">🔄</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
